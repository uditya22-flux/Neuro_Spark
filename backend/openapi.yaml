openapi: 3.1.0
info:
  title: MindBridge Guardian-Led Private Beta API
  version: 0.1.0
  description: >-
    Guardian-authorized accessibility and strengths-exploration API. It is not a
    diagnostic, screening, assessment, prediction, or employment service.
servers:
  - url: /v1
paths:
  /consent-versions/current:
    get:
      responses: { '200': { description: Active consent document } }
  /consents/verify-parent:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Parent verification and consent recorded } }
  /children:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Child profile created after verified consent } }
  /children/{childId}/discovery/intake:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Reviewable sensory configuration draft }, '202': { description: Restricted human-review path } }
  /children/{childId}/deepening/sessions:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: ChildExperience only } }
  /children/{childId}/synthesis:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Guardian-owned illustrative field note } }
  /privacy/export:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Guardian data export } }
  /privacy/purge:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '202': { description: Asynchronous, auditable purge accepted } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
