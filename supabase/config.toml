project_id = "mindbridge"

# Windows often blocks the default 5432x range (Hyper-V). Use 6432x locally.
[api]
port = 64321

[db]
port = 64332
major_version = 17

[studio]
port = 64323

[inbucket]
port = 64324

[auth]
site_url = "http://127.0.0.1:64321"
additional_redirect_urls = ["http://127.0.0.1:64321"]

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

